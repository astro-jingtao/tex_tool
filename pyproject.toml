[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tex_tool"
version = "0.1.0"
description = "Utilities for TeX, BibTeX, and LTeX."
requires-python = ">=3.8"
dependencies = [
    "bibtexparser>=1.4.0",
]

[project.scripts]
tex-tool = "tex_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
