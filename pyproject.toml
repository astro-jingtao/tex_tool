[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tex_tool"
version = "0.1.0"
description = "Utilities for TeX, BibTeX, and LTeX."
requires-python = ">=3.8"
dependencies = [
    # The code uses the v1 API (bibtexparser.bparser / loads / dump); v2
    # removed it, and no v2 release installs below Python 3.10 — see
    # ISSUE.md for the migration plan. Keep the resolver on the 1.x line.
    "bibtexparser>=1.4.0,<2",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tex-tool = "tex_tool.cli:main"

[tool.setuptools.package-data]
# Ship the agent-skill tree inside the package; package-data patterns reach
# both the wheel and the sdist, so no MANIFEST.in is needed.
"tex_tool.skills" = ["SKILL-DEPLOY.md", "tex-tool/**/*"]

[tool.setuptools.packages.find]
where = ["src"]
