# Multi-platform tests on every push (and pull request).
# The Python floor is 3.10: hosted runners (ubuntu-24.04, macos-14/15) no
# longer carry 3.8/3.9 builds, so the declared 3.8 compatibility stays
# unexercised here.
name: CI

on: [push, pull_request]

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q

  package:
    name: packaged wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel
        run: python -m pip install dist/*.whl
      - name: Discovery entry resolves the packaged skills tree
        run: |
          python -m tex_tool.skills
          python -c "from pathlib import Path; import tex_tool; root = Path(tex_tool.__file__).parent / 'skills'; assert (root / 'SKILL-DEPLOY.md').is_file() and (root / 'tex-tool' / 'skill' / 'SKILL.md').is_file() and not list(root.rglob('*.pyc'))"
      - name: Test against the installed wheel
        run: python -m pytest -q
      - name: Skills tree present in the sdist
        run: |
          tar -tzf dist/*.tar.gz | grep -F 'tex_tool/skills/tex-tool/skill/SKILL.md'
          test -z "$(tar -tzf dist/*.tar.gz | grep '\.pyc$')"
